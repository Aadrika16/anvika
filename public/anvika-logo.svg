<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 600" role="img" aria-labelledby="title desc">
  <title id="title">Anvika Fine Jewellery</title>
  <desc id="desc">Gold luxury wordmark for Anvika Fine Jewellery</desc>

  <defs>
    <linearGradient id="goldShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdeaa1"/>
      <stop offset="12%" stop-color="#f0ca67"/>
      <stop offset="30%" stop-color="#dca731"/>
      <stop offset="48%" stop-color="#f9df8c"/>
      <stop offset="65%" stop-color="#c88920"/>
      <stop offset="82%" stop-color="#f9dd7a"/>
      <stop offset="100%" stop-color="#d39a2c"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5c7"/>
      <stop offset="100%" stop-color="#b9761b"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#a86f13" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#softGlow)" transform="translate(20,0)">
    <text x="850" y="300"
      text-anchor="middle"
      font-size="320"
      font-family="Georgia, 'Times New Roman', serif"
      font-weight="400"
      fill="url(#goldShade)"
      stroke="#aa6510"
      stroke-width="5"
      paint-order="stroke fill"
      letter-spacing="-4">anvika</text>

    <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
      <text x="850" y="430"
        font-size="74"
        font-weight="600"
        fill="url(#goldGlow)"
        stroke="#b97b1f"
        stroke-width="3"
        paint-order="stroke fill"
        letter-spacing="18">FINE JEWELLERY</text>
    </g>
  </g>
</svg>
